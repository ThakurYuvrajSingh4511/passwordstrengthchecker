
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Security Analyzer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Background Effects -->
    <div class="bg-blur blue"></div>
    <div class="bg-blur purple"></div>
    <div class="bg-grid"></div>

    <!-- Main Card -->
    <div class="container">
        <h1>🔐 Password Security Analyzer</h1>
        <p class="subtitle">Cyber Security Assessment Tool</p>

        <!-- Password Input with Eye Icon -->
        <div class="password-wrapper">

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                oninput="checkPassword()"
            >

            <button
                type="button"
                id="togglePassword"
                onclick="togglePasswordVisibility()"
                aria-label="Show password"
                title="Show password"
            >
                <svg
                    id="eyeIcon"
                    xmlns="http://www.w3.org/2000/svg"
                    width="21"
                    height="21"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7-10-7-10-7z"/>
                    <circle cx="12" cy="12" r="3"/>
                </svg>
            </button>

        </div>

        <div class="progress">
            <div id="strength-bar"></div>
        </div>

        <p id="result"></p>

        <!-- Breach message JS se dynamically aayega -->

    </div>

    <script src="script.js"></script>

</body>
</html>
